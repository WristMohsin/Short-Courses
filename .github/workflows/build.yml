name: Build & Deploy OpenSkill Academy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: |
          echo "Building OpenSkill Academy static site..."
          # Create a clean dist folder
          mkdir -p dist
          # Copy all site files
          cp -r index.html css js dist/ 2>/dev/null || true
          cp -r courses data assets dist/ 2>/dev/null || true
          cp README.md dist/ 2>/dev/null || true
          # Ensure folders exist even if some are missing
          mkdir -p dist/css dist/js dist/courses dist/data
          # Simple validation
          if [ ! -f dist/index.html ]; then
            echo "Error: index.html not found"
            exit 1
          fi
          echo "Build completed successfully."
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
