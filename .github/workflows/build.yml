name: Build & Deploy OpenSkill Academy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: |
          echo "Building OpenSkill Academy static site..."
          mkdir -p dist
          # Copy ALL root HTML files (index, dashboard, etc.)
          cp -f *.html dist/ 2>/dev/null || true
          # Copy folders
          cp -r css js courses data assets dist/ 2>/dev/null || true
          cp README.md dist/ 2>/dev/null || true
          mkdir -p dist/css dist/js dist/courses dist/data
          if [ ! -f dist/index.html ]; then
            echo "Error: index.html not found"
            exit 1
          fi
          echo "=== dist contents ==="
          ls -la dist/
          ls -la dist/courses/ || true
          echo "Build completed successfully."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
